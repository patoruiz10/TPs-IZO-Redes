options {
    directory "/var/cache/bind";
    allow-query { any; };      # Permite consultas desde cualquier otra subred del laboratorio
	
       # 1. Habilitar la recursión para que busque hacia afuera
    recursion yes;
    
    # 2. Reenviar las consultas externas a los DNS de Google o de tu casa
    forwarders {
        8.8.8.8;
        8.8.4.4;
    };
};

# Definición de tu zona o dominio local
zone "ruiz.izo" {
    type master;
    file "/etc/bind/db.ruiz.izo";
};

